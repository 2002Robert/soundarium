<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soundarium 🐟</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020c1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Soundarium" />

    <!-- Icons -->
    <link rel="icon"             type="image/svg+xml" href="/fish.svg" />
    <link rel="apple-touch-icon"                      href="/fish.svg" />

    <!-- OG -->
    <meta property="og:title"       content="Soundarium 🐟" />
    <meta property="og:description" content="Hồ cá nhạc YouTube" />
    <meta property="og:type"        content="website" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Chặn YouTube IFrame tự pause khi user out app / tắt màn hình.
      YouTube check document.hidden + lắng nghe visibilitychange để pause —
      override cả hai trước khi YouTube API load.
    -->
    <script>
      try {
        Object.defineProperty(document, 'hidden', {
          get: function() { return false },
          configurable: true,
        })
        Object.defineProperty(document, 'visibilityState', {
          get: function() { return 'visible' },
          configurable: true,
        })
        document.addEventListener('visibilitychange',
          function(e) { e.stopImmediatePropagation() },
          true
        )
      } catch(e) {}
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: Keep Render server alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 35 https://soundarium-api.onrender.com/health)
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
